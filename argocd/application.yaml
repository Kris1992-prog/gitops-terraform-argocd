apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    
    repoURL: 'https://github.com/Kris1992-prog/gitops-terraform-argocd.git'
    targetRevision: HEAD
    path: 'k8s-manifests/app'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: demo-app
  syncPolicy:
    automated:
      prune: true       # Rimuove automaticamente le risorse eliminate da Git
      selfHeal: true    # Ripristina lo stato desiderato se qualcuno modifica manualmente il cluster
    syncOptions:
      - CreateNamespace=true